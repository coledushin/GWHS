<script>
  // Build the sticky section nav from the report's sections (## headings with a nav="…" label),
  // so it always matches report.qmd, then highlight the section currently in view.
  (function () {
    var bar = document.querySelector('nav .nav-inner');
    if (!bar) return;
    var links = {};
    document.querySelectorAll('section.level2[id]').forEach(function (s) {
      var a = document.createElement('a');
      a.href = '#' + s.id;
      a.textContent = s.dataset.nav || s.querySelector('h2').textContent;
      bar.appendChild(a);
      links[s.id] = a;
    });
    if (!('IntersectionObserver' in window)) return;
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        Object.values(links).forEach(function (a) { a.classList.remove('active'); });
        var a = links[e.target.id];
        if (a) { a.classList.add('active'); bar.scrollLeft = a.offsetLeft - (bar.clientWidth - a.offsetWidth) / 2; }
      });
    }, { rootMargin: '-30% 0px -60% 0px' });
    document.querySelectorAll('section.level2[id]').forEach(function (s) { obs.observe(s); });
  })();
  // Plotly sizes charts before fonts and grids settle; nudge a re-layout.
  setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 50);
  setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 300);
</script>
